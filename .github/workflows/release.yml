name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: choco install ninja nasm -y --no-progress

      - name: Use stable Rust
        run: rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $zip = "resizerrust-${{ github.ref_name }}-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\resizerrust.exe dist\resizerrust.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: resizerrust-${{ github.ref_name }}-windows-x64
          path: ${{ env.ZIP }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.ZIP }}" --title "ResizerRust ${{ github.ref_name }}" --generate-notes
